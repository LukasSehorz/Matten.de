<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Mattenfuchs</title>
<meta name="description" content="Beitraege des Mattenfuchs-Teams zu Matten, Fertigung und Gestaltung.">
<!-- Uebernommene Inhalte, noch nicht oeffentlich. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050a40">
<link rel="stylesheet" href="assets/css/net.css">
<link rel="stylesheet" href="assets/css/seiten-kasse.css">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
</head>
<body data-aktiv="/blog">

<a class="skiplink" href="#inhalt">Zum Inhalt springen</a>

<!-- Kopf und Navigation baut assets/js/net-shell.js hier ein. -->
<div id="kopf"></div>

<nav class="brotkrumen" aria-label="Sie sind hier">
  <div class="container">
    <ol>
      <li><a href="index.html">Startseite</a></li>
      <li><span aria-current="page">Blog</span></li>
    </ol>
  </div>
</nav>

<main id="inhalt">

<section class="abschnitt abschnitt--eng">
  <div class="container container--eng">
    <p class="label">Aus dem Betrieb</p>
    <h1>Blog</h1>
    <p class="vorspann">Zwei Beiträge — mehr führt die Vorlage nicht. Der Wortlaut ist unverändert
      übernommen, samt der englischen Datumsangabe und der alten E-Mail-Adresse.</p>

    <p class="mt-5" id="blog-zurueck" hidden>
      <a class="weiterlink" href="blog.html">Alle Beiträge</a>
    </p>
  </div>
</section>

<section class="abschnitt abschnitt--flach">
  <div class="container container--eng">
    <div id="blog-liste" aria-busy="true" data-laedt="true">
      <p class="nur-sr">Die Beiträge werden geladen.</p>

      <article class="beitrag" aria-hidden="true">
        <span class="skel skel--titel"></span>
        <span class="skel skel--zeile skel--kurz"></span>
        <span class="skel skel--zeile skel--voll"></span>
        <span class="skel skel--zeile skel--voll"></span>
        <span class="skel skel--zeile skel--mittel"></span>
      </article>

      <article class="beitrag" aria-hidden="true">
        <span class="skel skel--titel"></span>
        <span class="skel skel--zeile skel--kurz"></span>
        <span class="skel skel--zeile skel--mittel"></span>
      </article>
    </div>
  </div>
</section>

</main>

<!-- Fussbereich baut assets/js/net-shell.js hier ein. -->
<div id="fuss"></div>

<script src="assets/js/net-nav.js"></script>
<script src="assets/js/net-shell.js"></script>
<script src="assets/js/seite-inhalt.js"></script>
</body>
</html>
