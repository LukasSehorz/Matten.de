<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattenfuchs</title>
<meta name="keywords" content="e-commerce, matten">
<meta name="description" content="Matten.de e-commerce">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="matten.de">
<meta property="og:description" content="Matten.de e-commerce">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-16x16.png" sizes="16x16">
<link rel="stylesheet" href="assets/css/matten-net.css">
<link rel="stylesheet" href="assets/css/animate.css">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<link rel="stylesheet" href="assets/fontawesome/css/all.css">
<link rel="stylesheet" href="assets/css/net-neu.css">
</head>
<body id="">
<div style="background: #fff;">
<div id="net-kopf"></div>

<div style="min-height: 500px;">
    <div class="container">
        <h1 class="padding-top">Registrieren</h1>
        <p>Haben Sie schon ein Konto? <a href="login.html">Klick hier zum Login.</a></p>
        <form name="user_registration" method="post" id="register-form">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group"><label class="required" for="user_registration_email">eMail</label><input type="email" id="user_registration_email" name="user_registration[email]" required autocomplete="email" class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_plainPassword">Passwort</label><input type="password" id="user_registration_plainPassword" name="user_registration[plainPassword]" required autocomplete="new-password" class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_title">Anrede</label><input type="text" id="user_registration_customer_title" name="user_registration[customer][title]" required class="form-control"></div>
                    <div class="form-group"><label for="user_registration_customer_firstName">Vorname</label><input type="text" id="user_registration_customer_firstName" name="user_registration[customer][firstName]" class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_lastName">Nachname</label><input type="text" id="user_registration_customer_lastName" name="user_registration[customer][lastName]" required class="form-control"></div>
                    <div class="form-group"><label for="user_registration_customer_companyName">Firmenname</label><input type="text" id="user_registration_customer_companyName" name="user_registration[customer][companyName]" class="form-control"></div>
                    <div class="form-group"><label for="user_registration_customer_taxId">USt-ID</label><input type="text" id="user_registration_customer_taxId" name="user_registration[customer][taxId]" class="form-control"></div>
                </div>
                <div class="col-md-6">
                    <div class="form-group"><label class="required" for="user_registration_customer_streetAddress">Straße</label><input type="text" id="user_registration_customer_streetAddress" name="user_registration[customer][streetAddress]" required class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_city">Stadt</label><input type="text" id="user_registration_customer_city" name="user_registration[customer][city]" required class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_state">Bundesland</label><input type="text" id="user_registration_customer_state" name="user_registration[customer][state]" required class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_postalCode">PLZ</label><input type="text" id="user_registration_customer_postalCode" name="user_registration[customer][postalCode]" required class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_country">Land</label><select id="user_registration_customer_country" name="user_registration[customer][country]" class="form-control"><option value="DE" selected>Deutschland</option></select></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_phone">Telefon</label><input type="text" id="user_registration_customer_phone" name="user_registration[customer][phone]" required class="form-control"></div>
                    <div class="form-group"><label class="required" for="user_registration_customer_mobile">Mobil</label><input type="text" id="user_registration_customer_mobile" name="user_registration[customer][mobile]" required class="form-control"></div>
                    <div class="form-group"><label for="user_registration_customer_fax">Fax</label><input type="text" id="user_registration_customer_fax" name="user_registration[customer][fax]" class="form-control"></div>
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary" id="register-knopf">versenden</button>
        </form>
        <div id="register-melder" class="mt-3"></div>
    </div>
</div>

<div id="net-fuss"></div>
</div>
<div class="overlay"></div>
<script src="assets/js/vendor/jquery.min.js"></script>
<script src="assets/js/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/daten.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/seite-konto.js"></script>
</body>
</html>
