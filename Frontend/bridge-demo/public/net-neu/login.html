<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattenfuchs</title>
<meta name="keywords" content="e-commerce, matten">
<meta name="description" content="Matten.de e-commerce">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="matten.de">
<meta property="og:description" content="Matten.de e-commerce">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-16x16.png" sizes="16x16">
<link rel="stylesheet" href="assets/css/matten-net.css">
<link rel="stylesheet" href="assets/css/animate.css">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<link rel="stylesheet" href="assets/fontawesome/css/all.css">
<link rel="stylesheet" href="assets/css/net-neu.css">
</head>
<body id="">
<div style="background: #fff;">
<div id="net-kopf"></div>

<div style="min-height: 500px;">
    <div class="container">
        <h2 class="padding-top">Login</h2>
        <p>
            Haben Sie ein Konto? <a href="register.html">Klick hier zur Registrierung.</a><br>
            Passwort vergessen? <a href="#passwort" id="passwort-reset">Klick hier zum Reset.</a>
        </p>
        <div id="login-status"></div>
        <form action="login.html" method="post" style="max-width: 400px;" id="login-form">
            <div class="form-group">
                <label for="form-full-name">eMail</label>
                <input type="text" class="form-control" id="form-full-name" name="_username" placeholder="eMail-Adresse eingeben" value="" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="form-password">Passwort</label>
                <input type="password" class="form-control" id="form-password" name="_password" placeholder="Passwort eingeben" autocomplete="current-password" required>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="form-remember-me" name="_remember_me">
                <label class="custom-control-label" for="form-remember-me">mich erinnern</label>
            </div>
            <br>
            <button type="submit" class="btn btn-primary" id="login-knopf"><i class="fa fa-sign-in-alt"></i> Login</button>
        </form>
        <div id="login-melder" class="mt-3" style="max-width: 400px;"></div>
    </div>
</div>

<div id="net-fuss"></div>
</div>
<div class="overlay"></div>
<script src="assets/js/vendor/jquery.min.js"></script>
<script src="assets/js/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/daten.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/seite-konto.js"></script>
</body>
</html>
