<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattenfuchs</title>
<meta name="keywords" content="e-commerce, matten">
<meta name="description" content="Matten.de e-commerce">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="matten.de">
<meta property="og:description" content="Matten.de e-commerce">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/sonstige/favicon-16x16.png" sizes="16x16">
<link rel="stylesheet" href="assets/css/matten-net.css">
<link rel="stylesheet" href="assets/css/animate.css">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<link rel="stylesheet" href="assets/fontawesome/css/all.css">
<link rel="stylesheet" href="assets/css/net-neu.css">
</head>
<body id="product_view">
<div style="background: #fff;">
<div id="net-kopf"></div>

<div style="min-height: 500px;">
    <div class="container">
        <nav>
            <ol class="breadcrumb m-0 mt-1 p-0" id="brotkrumen"></ol>
        </nav>

        <div class="row">
            <div class="col-lg-6">
                <div id="variety-images" class="unselectable"></div>
            </div>

            <div class="col-lg-6 single-product-info">
                <div style="position: absolute; background-color: rgba(255, 255, 255, 0.5); z-index: 20; width: 100%; height: 100%;"
                     class="d-none justify-content-center align-items-center product-loading">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>

                <h2 class="mb-0" id="produkt-name"></h2>

                <div class="stars">
                </div>

                <form id="add_to_cart_form"
                      class=""
                      action="#"
                      method="post"
                      data-no-enter-submit>

                    <input type="hidden" id="product_id" name="product_id" value="">

                    <div id="attribute-bereich"></div>

                    <section class="order-form" id="order-form"></section>
                </form>
                <div id="produkt-meldung" aria-live="polite"></div>
            </div>
        </div>

        <!-- Tab view -->
        <ul class="nav nav-tabs nav-tabs-sm mt-1" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="description-tab" data-toggle="tab" href="#description" role="tab">Beschreibung</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="reviews-tab" data-toggle="tab" href="#reviews" role="tab">Bewertungen</a>
            </li>
        </ul>

        <div class="tab-content pt-1">
            <div class="tab-pane fade show active" id="description" role="tabpanel">
                <div class="description-content" id="beschreibung"></div>
            </div>
            <div class="tab-pane fade" id="reviews" role="tabpanel">

            </div>
        </div>
    </div>
</div>

<div id="net-fuss"></div>
</div>
<div class="overlay"></div>
<script src="assets/js/vendor/jquery.min.js"></script>
<script src="assets/js/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/daten.js"></script>
<script src="assets/js/shell.js"></script>
<script type="module" src="assets/js/seite-produkt.js"></script>
</body>
</html>
